project:
  name: runners

services:
  - hostname: zclirunner
    type: ubuntu@26.04
    vault:
      GITHUB_REPO: "PLACE_YOUR_GITHUB_REPO_URL_HERE"
      RUNNER_LABELS: "" # Example: self-hosted,linux,x64,zerops,zcli
      GITHUB_TOKEN:
        value: "PLACE_YOUR_GITHUB_TOKEN_HERE"
        sensitive: true
    buildFromGit: https://github.com/zeropsio/recipe-zcli-github-runner
    # Set a fixed number of containers, runners shouldn't be scaling horizontally automatically
    minContainers: 2
    maxContainers: 2
